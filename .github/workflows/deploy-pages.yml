name: Deploy Next.js site to Pages

on:
  push:
    branches:
      - visual/subtle-rastafarian-polish
      - point-of-sale-poc
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main site branch
        uses: actions/checkout@v4
        with:
          ref: visual/subtle-rastafarian-polish
          path: root-site

      - name: Checkout POS POC branch
        uses: actions/checkout@v4
        with:
          ref: point-of-sale-poc
          path: point-of-sale-poc-site

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build main site
        working-directory: root-site
        run: |
          npm ci
          NEXT_PUBLIC_BASE_PATH=/sista_rootz_website npm run build
          mkdir -p ../pages-artifact
          cp -R out/. ../pages-artifact/

      - name: Build POS POC site
        working-directory: point-of-sale-poc-site
        run: |
          npm ci
          NEXT_PUBLIC_BASE_PATH=/sista_rootz_website/point-of-sale-poc npm run build
          mkdir -p ../pages-artifact/point-of-sale-poc
          cp -R out/. ../pages-artifact/point-of-sale-poc/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-artifact

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
